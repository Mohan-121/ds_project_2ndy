[project]
name = "urbaniq-backend"
version = "1.0.0"
description = "UrbanIQ: AI-Driven Digital Twin for Predictive Smart City Operations (Coimbatore)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "holidays>=0.58",
    "shapely>=2.0.6",
    "reportlab>=4.2.5",
    "pandas>=2.2.3",
    "scikit-learn>=1.5.2",
    "xgboost>=2.1.1",
    "paho-mqtt>=2.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
